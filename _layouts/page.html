---
layout: default
---
<article class="post">
  <header class="post__head">
    <h1 class="post__title">{{ page.title | escape }}</h1>
    {%- if page.description %}
    <p class="post__lede">{{ page.description }}</p>
    {%- endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
