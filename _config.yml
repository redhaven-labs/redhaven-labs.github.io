title: "redhaven's Blog"
tagline: "Notes on code, tools, and things I'm figuring out"
description: >-
  Writeups and research on Active Directory, Azure, and AWS attacks, Windows internals, and AV/EDR evasion. Mostly lab-based: attack path analysis, hybrid identity abuse, cloud IAM and privilege escalation, protocol and internals deep dives, and notes on detection and evasion. Written down so I remember it, published in case it's useful to someone else.

author:
  name: "Mohamed"
  bio: "Cybersecurity engineer with 2+ years of penetration testing experience across internal and external networks, Active Directory, and cloud environments. Particularly interested in Active Directory security, Windows internals, and AV/EDR evasion."

url: "https://redhaven-labs.github.io"
baseurl: ""

github_username: redhaven-labs

social:
  github: redhaven-labs

nav:
  - { title: "Posts", url: "/" }
  - { title: "Tags", url: "/tags/" }
  - { title: "About", url: "/about/" }

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title/
timezone: Etc/UTC
paginate: 6
paginate_path: "/page:num/"
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
  - .bundle
